<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>OrielAi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cg%20transform%3D%22rotate(-20%2050%2050)%22%20fill%3D%22%233f7fc4%22%3E%3Cpath%20fill-rule%3D%22evenodd%22%20d%3D%22M10%2050a40%2024%200%201%200%2080%200a40%2024%200%201%200-80%200zM16.5%2048a34%2019.5%200%201%200%2068%200a34%2019.5%200%201%200-68%200z%22%2F%3E%3Cpath%20d%3D%22M5%2050A45%2028.5%200%200%201%2046%2021.6A46.5%2030%200%200%200%205%2050zM95%2050A45%2028.5%200%200%201%2054%2078.4A46.5%2030%200%200%200%2095%2050z%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
  :root {
    --stage: #ececee;
    --bg: #ffffff;
    --ink: #0a0a0a;
    --muted: #8e8e93;
    --bubble: #f2f2f4;
    --surface: #f7f7f8;
    --line: rgba(0, 0, 0, 0.08);
    --accent-bg: #0a0a0a;
    --accent-fg: #ffffff;
    --error: #c62828;
    --scrim: rgba(0, 0, 0, 0.32);
    --frame: #0c0c0d;
    --frame-ring: rgba(0, 0, 0, 0);
    --brand: #3f7fc4;
    --brand-soft: #5aa5e3;
    --scale: 1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --stage: #050505;
      --bg: #000000;
      --ink: #f5f5f7;
      --muted: #8e8e93;
      --bubble: #1c1c1e;
      --surface: #111112;
      --line: rgba(255, 255, 255, 0.12);
      --accent-bg: #f5f5f7;
      --accent-fg: #0a0a0a;
      --error: #ff6b6b;
      --scrim: rgba(0, 0, 0, 0.6);
      --frame: #0c0c0d;
      --frame-ring: rgba(255, 255, 255, 0.14);
      --brand: #5b9bdc;
      --brand-soft: #7dbcf0;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background: var(--stage);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  button, textarea {
    font: inherit;
    color: inherit;
  }

  /* ---------- iPhone frame ---------- */

  .phone {
    position: relative;
    flex: none;
    width: 412px;
    height: 866px;
    padding: 11px;
    border-radius: 58px;
    background: var(--frame);
    box-shadow:
      0 0 0 1px var(--frame-ring),
      0 40px 80px -20px rgba(0, 0, 0, 0.35),
      0 18px 36px -18px rgba(0, 0, 0, 0.3);
    transform: scale(var(--scale));
    transform-origin: center;
  }

  .side {
    position: absolute;
    width: 3px;
    border-radius: 2px;
    background: var(--frame);
    box-shadow: 0 0 0 1px var(--frame-ring);
  }
  .side.action { left: -3px; top: 118px; height: 30px; }
  .side.vol-up { left: -3px; top: 176px; height: 58px; }
  .side.vol-down { left: -3px; top: 248px; height: 58px; }
  .side.power { right: -3px; top: 204px; height: 92px; }

  .screen {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 47px;
    background: var(--bg);
  }

  .island {
    position: absolute;
    top: 11px;
    left: 50%;
    z-index: 6;
    width: 122px;
    height: 35px;
    border-radius: 20px;
    background: #000;
    transform: translateX(-50%);
  }

  .statusbar {
    position: relative;
    z-index: 5;
    display: flex;
    flex: none;
    align-items: center;
    justify-content: space-between;
    height: 54px;
    padding: 6px 30px 0 38px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    pointer-events: none;
  }

  .statusbar .icons {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .statusbar svg { display: block; fill: currentColor; }

  .home-indicator {
    position: absolute;
    bottom: 8px;
    left: 50%;
    z-index: 6;
    width: 136px;
    height: 5px;
    border-radius: 3px;
    background: var(--ink);
    transform: translateX(-50%);
    pointer-events: none;
  }

  /* ---------- Header ---------- */

  .header {
    display: grid;
    flex: none;
    grid-template-columns: 36px 1fr 36px;
    align-items: center;
    height: 48px;
    padding: 0 12px;
  }

  .wordmark {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 0;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.02em;
  }
  .wordmark svg { display: block; flex: none; color: var(--brand); }
  .wordmark .ai { color: var(--brand-soft); }

  .icon-btn {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    transition: background-color 0.15s ease, opacity 0.15s ease;
  }
  .icon-btn:hover { background: var(--bubble); }
  .icon-btn:active { opacity: 0.6; }
  .icon-btn svg { display: block; }

  /* ---------- Conversation ---------- */

  .chat {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
  }
  .chat::-webkit-scrollbar { display: none; }

  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
    text-align: center;
  }
  .empty[hidden] { display: none; }

  .empty .mark {
    display: block;
    width: 84px;
    height: 84px;
    margin-bottom: 10px;
    color: var(--brand);
  }

  .empty h2 {
    margin: 0 0 24px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .chips {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 270px;
  }

  .chip {
    padding: 11px 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: transparent;
    font-size: 15px;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .chip:hover { background: var(--bubble); }
  .chip:active { opacity: 0.6; }

  .thread {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin: 0;
    padding: 12px 18px 20px;
    list-style: none;
  }
  .thread:empty { display: none; }

  .msg {
    font-size: 16px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    animation: rise 0.22s ease both;
  }

  /* You: a soft pill on the right. Ori: plain text across the full width. */
  .msg.user {
    align-self: flex-end;
    max-width: 82%;
    padding: 9px 15px;
    border-radius: 20px;
    background: var(--bubble);
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .msg.bot { align-self: stretch; }

  .msg.bot > :first-child { margin-top: 0; }
  .msg.bot > :last-child { margin-bottom: 0; }

  .msg.bot p { margin: 0 0 12px; }

  .msg.bot h3,
  .msg.bot h4 {
    margin: 18px 0 8px;
    font-weight: 600;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }
  .msg.bot h3 { font-size: 18px; }
  .msg.bot h4 { font-size: 16px; }

  .msg.bot ul,
  .msg.bot ol {
    margin: 0 0 12px;
    padding-left: 22px;
  }
  .msg.bot li { margin: 4px 0; }
  .msg.bot li::marker { color: var(--muted); }

  .msg.bot a {
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .msg.bot code {
    padding: 2px 5px;
    border-radius: 6px;
    background: var(--bubble);
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.86em;
  }

  .msg.bot pre {
    margin: 0 0 12px;
    padding: 12px 14px;
    overflow-x: auto;
    border-radius: 12px;
    background: var(--bubble);
    line-height: 1.45;
    scrollbar-width: none;
  }
  .msg.bot pre::-webkit-scrollbar { display: none; }
  .msg.bot pre code {
    padding: 0;
    background: transparent;
    font-size: 13px;
    white-space: pre;
    overflow-wrap: normal;
  }

  .msg.bot blockquote {
    margin: 0 0 12px;
    padding-left: 12px;
    border-left: 2px solid var(--line);
    color: var(--muted);
  }

  .msg.bot hr {
    height: 1px;
    margin: 16px 0;
    border: 0;
    background: var(--line);
  }

  .msg.thinking::before {
    content: "";
    display: block;
    width: 12px;
    height: 12px;
    margin: 6px 0;
    border-radius: 50%;
    background: var(--ink);
    animation: pulse 1.1s infinite ease-in-out;
  }

  .msg.error {
    align-self: stretch;
    color: var(--error);
    font-size: 14px;
    line-height: 1.4;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* ---------- Composer ---------- */

  .composer {
    flex: none;
    padding: 8px 12px 30px;
    background: var(--bg);
  }

  .field {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 6px 6px 6px 18px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: var(--surface);
    transition: border-color 0.15s ease;
  }
  .field:focus-within { border-color: var(--muted); }

  .field textarea {
    flex: 1;
    min-width: 0;
    height: 34px;
    max-height: 120px;
    margin: 0;
    padding: 7px 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 16px;
    line-height: 20px;
    resize: none;
    scrollbar-width: none;
  }
  .field textarea::-webkit-scrollbar { display: none; }
  .field textarea::placeholder { color: var(--muted); opacity: 1; }

  .send {
    display: grid;
    flex: none;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--accent-bg);
    color: var(--accent-fg);
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .send:active:not(:disabled) { transform: scale(0.92); }
  .send:disabled { opacity: 0.2; cursor: default; }
  .send svg { display: block; }
  .send .stop-icon { display: none; }
  .send.stop .send-icon { display: none; }
  .send.stop .stop-icon { display: block; }

  /* ---------- Chats drawer ---------- */

  .scrim {
    position: absolute;
    inset: 0;
    z-index: 3;
    background: var(--scrim);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.28s ease, visibility 0s linear 0.28s;
  }

  .drawer {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    width: 80%;
    max-width: 320px;
    padding: 58px 10px 24px;
    background: var(--bg);
    border-right: 1px solid var(--line);
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), visibility 0s linear 0.28s;
  }

  .screen.drawer-open .scrim {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.28s ease, visibility 0s;
  }
  .screen.drawer-open .drawer {
    transform: none;
    visibility: visible;
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), visibility 0s;
  }

  .drawer-new {
    display: flex;
    flex: none;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 11px 12px;
    border: 0;
    border-radius: 12px;
    background: transparent;
    font-size: 16px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }
  .drawer-new:hover { background: var(--bubble); }
  .drawer-new svg { display: block; flex: none; }

  .drawer-label {
    flex: none;
    margin: 18px 12px 6px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
  }

  .drawer-empty {
    margin: 4px 12px;
    color: var(--muted);
    font-size: 15px;
  }
  .drawer-empty[hidden] { display: none; }

  .chat-list {
    flex: 1;
    min-height: 0;
    margin: 0;
    padding: 0;
    overflow-y: auto;
    list-style: none;
    scrollbar-width: none;
  }
  .chat-list::-webkit-scrollbar { display: none; }

  .chat-item {
    display: flex;
    align-items: center;
    margin-bottom: 2px;
    border-radius: 12px;
    transition: background-color 0.15s ease;
  }
  .chat-item:hover,
  .chat-item.active { background: var(--bubble); }

  .chat-open {
    flex: 1;
    min-width: 0;
    padding: 11px 4px 11px 12px;
    overflow: hidden;
    border: 0;
    border-radius: 12px;
    background: transparent;
    font-size: 15px;
    text-align: left;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }

  .chat-del {
    display: grid;
    flex: none;
    place-items: center;
    width: 34px;
    height: 34px;
    margin-right: 4px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .chat-del:hover { color: var(--error); }
  .chat-del svg { display: block; }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 2px;
  }
  .field textarea:focus-visible { outline: 0; }
  .chat-open:focus-visible { outline-offset: -2px; }

  /* ---------- On a real phone: drop the frame, fill the screen ---------- */

  @media (max-width: 480px) {
    body {
      display: block;
      background: var(--bg);
    }
    .phone {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 0;
      border-radius: 0;
      background: var(--bg);
      box-shadow: none;
      transform: none;
    }
    .screen { border-radius: 0; }
    .side, .island, .statusbar, .home-indicator { display: none; }
    .header {
      height: calc(48px + env(safe-area-inset-top));
      padding-top: env(safe-area-inset-top);
    }
    .composer { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
    .drawer {
      padding-top: calc(10px + env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .msg, .msg.thinking::before { animation: none; }
    .scrim, .drawer,
    .screen.drawer-open .scrim,
    .screen.drawer-open .drawer { transition: none; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="oriel-mark" viewBox="0 0 100 100">
    <g transform="rotate(-20 50 50)" fill="currentColor">
      <path fill-rule="evenodd" d="M10 50a40 24 0 1 0 80 0a40 24 0 1 0-80 0zM16.5 48a34 19.5 0 1 0 68 0a34 19.5 0 1 0-68 0z"/>
      <path d="M3 51A47 31 0 0 1 47 19A52 37 0 0 0 3 51zM97 49A47 31 0 0 1 53 81A52 37 0 0 0 97 49z"/>
    </g>
  </symbol>
</svg>

<div class="phone" id="phone">
  <span class="side action"></span>
  <span class="side vol-up"></span>
  <span class="side vol-down"></span>
  <span class="side power"></span>

  <main class="screen" id="screen">
    <div class="island" aria-hidden="true"></div>

    <div class="statusbar" aria-hidden="true">
      <span id="clock">9:41</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.3 2.5.2.2.5.2.7 0l.9-.9c.2-.2.2-.5 0-.7C14.3 1.200 11.500 0 8.500 0S2.700 1.200.600 3.200c-.2.2-.2.5 0 .7l.9.9c.2.2.5.2.7 0C3.900 3.200 6.100 2.300 8.500 2.300z"/><path d="M8.5 6.100c1.300 0 2.500.5 3.500 1.300.2.2.5.2.7 0l.9-.9c.2-.2.2-.5 0-.7-1.400-1.200-3.200-2-5.100-2s-3.700.8-5.100 2c-.2.2-.2.5 0 .7l.9.9c.2.2.5.2.7 0 1-.8 2.200-1.300 3.500-1.300z"/><path d="M10.700 9.200c.2-.2.2-.5 0-.7-.6-.5-1.400-.8-2.200-.8s-1.600.3-2.200.8c-.2.2-.2.5 0 .7l1.800 1.900c.2.2.5.2.7 0l1.900-1.900z"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="19" height="9" rx="2"/><path d="M24 4.500v4c.8-.3 1.500-1.100 1.500-2s-.7-1.700-1.500-2z" opacity="0.45"/></svg>
      </span>
    </div>

    <header class="header">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Chats" title="Chats" aria-controls="drawer" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.500 7h13"/><path d="M3.500 13h8"/></svg>
      </button>
      <h1 class="wordmark" aria-label="OrielAi"><svg width="30" height="30" aria-hidden="true"><use href="#oriel-mark"/></svg><span>Oriel<span class="ai">Ai</span></span></h1>
      <button class="icon-btn" id="newChat" type="button" aria-label="New chat" title="New chat">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.500H5.500a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V10"/><path d="M14.800 2.900a1.600 1.600 0 0 1 2.300 2.300L10.500 11.800l-3 .700.700-3 6.600-6.600z"/></svg>
      </button>
    </header>

    <section class="chat" id="chat" aria-label="Conversation">
      <div class="empty" id="empty">
        <svg class="mark" aria-hidden="true"><use href="#oriel-mark"/></svg>
        <h2>What are you thinking through?</h2>
        <div class="chips">
          <button class="chip" type="button">Help me think through a decision</button>
          <button class="chip" type="button">Help me sharpen my writing</button>
          <button class="chip" type="button">Help me understand something</button>
        </div>
      </div>
      <ol class="thread" id="thread"></ol>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <div class="field">
        <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message" enterkeyhint="send"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg class="send-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3"/><path d="M3.500 7.500L8 3l4.500 4.500"/></svg>
          <svg class="stop-icon" width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><rect width="12" height="12" rx="2.5"/></svg>
        </button>
      </div>
    </form>

    <div class="scrim" id="scrim"></div>

    <aside class="drawer" id="drawer" aria-label="Chats">
      <button class="drawer-new" id="drawerNew" type="button">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.500H5.500a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V10"/><path d="M14.800 2.900a1.600 1.600 0 0 1 2.300 2.300L10.500 11.800l-3 .700.700-3 6.600-6.600z"/></svg>
        New chat
      </button>
      <div class="drawer-label">Chats</div>
      <p class="drawer-empty" id="drawerEmpty">No chats yet</p>
      <ul class="chat-list" id="chatList"></ul>
    </aside>

    <div class="home-indicator" aria-hidden="true"></div>
  </main>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'ori.chats.v2';
  var MAX_CHATS = 100;
  var TITLE_LENGTH = 40;

  var phone = document.getElementById('phone');
  var screen = document.getElementById('screen');
  var clock = document.getElementById('clock');
  var chatEl = document.getElementById('chat');
  var empty = document.getElementById('empty');
  var thread = document.getElementById('thread');
  var form = document.getElementById('composer');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var menuBtn = document.getElementById('menuBtn');
  var newChatBtn = document.getElementById('newChat');
  var drawerNewBtn = document.getElementById('drawerNew');
  var scrim = document.getElementById('scrim');
  var chatList = document.getElementById('chatList');
  var drawerEmpty = document.getElementById('drawerEmpty');

  var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  var chats = [];        // [{ id, title, updated, messages: [{ role, content }] }]
  var currentId = null;  // null = a fresh chat that has no messages yet
  var busy = false;
  var controller = null;
  var runId = 0;

  /* ---------- Markdown (assistant replies) ---------- */

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // Text is escaped first; only the tags added below ever reach the page.
  function inline(text) {
    var stash = [];
    function keep(html) {
      stash.push(html);
      return '\u0000' + (stash.length - 1) + '\u0000';
    }
    var s = escapeHtml(text);
    s = s.replace(/`([^`\n]+)`/g, function (_, code) {
      return keep('<code>' + code + '</code>');
    });
    s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, function (_, label, url) {
      return keep('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>');
    });
    s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*\w])\*([^*\s][^*\n]*?)\*(?!\w)/g, '$1<em>$2</em>');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) {
      return stash[Number(i)];
    });
  }

  var RE_FENCE = /^\s*```/;
  var RE_HEADING = /^(#{1,6})\s+(\S.*)$/;
  var RE_BULLET = /^\s*[-*+]\s+(\S.*)$/;
  var RE_NUMBER = /^\s*(\d{1,9})[.)]\s+(\S.*)$/;
  var RE_QUOTE = /^>\s?(.*)$/;
  var RE_RULE = /^\s*(-{3,}|\*{3,}|_{3,})\s*$/;
  var RE_BLANK = /^\s*$/;

  function startsBlock(line) {
    return RE_FENCE.test(line) || RE_HEADING.test(line) || RE_BULLET.test(line) ||
      RE_NUMBER.test(line) || RE_QUOTE.test(line) || RE_RULE.test(line);
  }

  function renderMarkdown(src) {
    var lines = src.replace(/\u0000/g, '').replace(/\r\n?/g, '\n').split('\n');
    var out = [];
    var i = 0;
    var m;

    function listItems(re) {
      var items = [];
      while (i < lines.length) {
        var item = lines[i].match(re);
        if (item) {
          items.push(inline(item[item.length - 1]));
        } else if (items.length && /^\s{2,}\S/.test(lines[i]) && !startsBlock(lines[i])) {
          items[items.length - 1] += '<br>' + inline(lines[i].trim()); // wrapped line of the same item
        } else {
          break;
        }
        i += 1;
      }
      return '<li>' + items.join('</li><li>') + '</li>';
    }

    while (i < lines.length) {
      var line = lines[i];

      if (RE_BLANK.test(line)) {
        i += 1;
      } else if (RE_FENCE.test(line)) {
        var code = [];
        i += 1;
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) {
          code.push(lines[i]);
          i += 1;
        }
        i += 1; // closing fence (or the end, while a reply is still streaming)
        out.push('<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>');
      } else if (RE_RULE.test(line)) {
        out.push('<hr>');
        i += 1;
      } else if ((m = line.match(RE_HEADING))) {
        var tag = m[1].length <= 2 ? 'h3' : 'h4';
        out.push('<' + tag + '>' + inline(m[2]) + '</' + tag + '>');
        i += 1;
      } else if (RE_BULLET.test(line)) {
        out.push('<ul>' + listItems(RE_BULLET) + '</ul>');
      } else if ((m = line.match(RE_NUMBER))) {
        out.push('<ol start="' + Number(m[1]) + '">' + listItems(RE_NUMBER) + '</ol>');
      } else if (RE_QUOTE.test(line)) {
        var quote = [];
        while (i < lines.length && (m = lines[i].match(RE_QUOTE))) {
          quote.push(inline(m[1]));
          i += 1;
        }
        out.push('<blockquote>' + quote.join('<br>') + '</blockquote>');
      } else {
        var para = [];
        do {
          para.push(inline(lines[i].trim()));
          i += 1;
        } while (i < lines.length && !RE_BLANK.test(lines[i]) && !startsBlock(lines[i]));
        out.push('<p>' + para.join('<br>') + '</p>');
      }
    }
    return out.join('');
  }

  /* ---------- Storage ---------- */

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ chats: chats.slice(0, MAX_CHATS), currentId: currentId }));
    } catch (err) { /* storage unavailable: chats still work for this visit */ }
  }

  function load() {
    try {
      localStorage.removeItem('ori.chat.v1'); // left over from the first version
      var data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!data || !Array.isArray(data.chats)) return;
      chats = data.chats.filter(function (c) {
        return c && typeof c.id === 'string' && typeof c.title === 'string' && Array.isArray(c.messages);
      }).map(function (c) {
        return {
          id: c.id,
          title: c.title,
          updated: Number(c.updated) || 0,
          messages: c.messages.filter(function (m) {
            return m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string';
          })
        };
      }).filter(function (c) {
        return c.messages.length > 0;
      });
      if (findChat(data.currentId)) currentId = data.currentId;
    } catch (err) {
      chats = [];
      currentId = null;
    }
  }

  function findChat(id) {
    for (var i = 0; i < chats.length; i += 1) {
      if (chats[i].id === id) return chats[i];
    }
    return null;
  }

  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function makeTitle(text) {
    var title = text.replace(/\s+/g, ' ').trim();
    return title.length > TITLE_LENGTH ? title.slice(0, TITLE_LENGTH).trim() + '…' : title;
  }

  /* ---------- Rendering ---------- */

  function nearBottom() {
    return chatEl.scrollHeight - chatEl.scrollTop - chatEl.clientHeight < 80;
  }

  function scrollToBottom(smooth) {
    chatEl.scrollTo({ top: chatEl.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
  }

  function addMessageEl(role, content) {
    var li = document.createElement('li');
    if (role === 'user') {
      li.className = 'msg user';
      li.textContent = content;
    } else if (role === 'error') {
      li.className = 'msg error';
      li.setAttribute('role', 'alert');
      li.textContent = content;
    } else {
      li.className = 'msg bot';
      li.innerHTML = renderMarkdown(content);
    }
    thread.appendChild(li);
    return li;
  }

  function renderThread() {
    var chat = findChat(currentId);
    thread.textContent = '';
    empty.hidden = !!chat;
    if (chat) {
      chat.messages.forEach(function (m) {
        addMessageEl(m.role, m.content);
      });
    }
    scrollToBottom(false);
  }

  function renderDrawer() {
    var sorted = chats.slice().sort(function (a, b) {
      return b.updated - a.updated;
    });
    chatList.textContent = '';
    drawerEmpty.hidden = sorted.length > 0;

    sorted.forEach(function (chat) {
      var li = document.createElement('li');
      li.className = 'chat-item' + (chat.id === currentId ? ' active' : '');

      var open = document.createElement('button');
      open.type = 'button';
      open.className = 'chat-open';
      open.dataset.id = chat.id;
      open.textContent = chat.title;
      open.title = chat.title;
      if (chat.id === currentId) open.setAttribute('aria-current', 'true');

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'chat-del';
      del.dataset.id = chat.id;
      del.setAttribute('aria-label', 'Delete chat: ' + chat.title);
      del.title = 'Delete chat';
      del.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.500h10"/><path d="M6.500 4.500V3h3v1.500"/><path d="M4.500 4.500l.5 8.500h6l.5-8.500"/></svg>';

      li.appendChild(open);
      li.appendChild(del);
      chatList.appendChild(li);
    });
  }

  function updateSendState() {
    sendBtn.classList.toggle('stop', busy);
    sendBtn.disabled = !busy && input.value.trim() === '';
    sendBtn.setAttribute('aria-label', busy ? 'Stop' : 'Send');
  }

  function resizeInput() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }

  /* ---------- Drawer ---------- */

  function openDrawer() {
    screen.classList.add('drawer-open');
    menuBtn.setAttribute('aria-expanded', 'true');
  }

  function closeDrawer() {
    screen.classList.remove('drawer-open');
    menuBtn.setAttribute('aria-expanded', 'false');
  }

  /* ---------- Chats ---------- */

  // Abandon a reply in progress; whatever has arrived so far is kept in its chat.
  function cancelRun() {
    runId += 1;
    if (controller) controller.abort();
    controller = null;
    busy = false;
  }

  function showChat(id) {
    cancelRun();
    currentId = id && findChat(id) ? id : null;
    save();
    renderThread();
    renderDrawer();
    updateSendState();
    closeDrawer();
    if (finePointer) input.focus();
  }

  function deleteChat(id) {
    var chat = findChat(id);
    if (!chat || !window.confirm('Delete "' + chat.title + '"?')) return;
    if (id === currentId) {
      cancelRun();
      currentId = null;
      renderThread();
      updateSendState();
    }
    chats = chats.filter(function (c) {
      return c.id !== id;
    });
    save();
    renderDrawer();
  }

  /* ---------- Sending ---------- */

  async function requestReply(messages, signal, onText) {
    var res;
    try {
      res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: messages }),
        signal: signal
      });
    } catch (err) {
      if (err && err.name === 'AbortError') throw err;
      throw new Error('Can’t reach Ori’s server. Run "npm start" in the Ori folder, then reload this page.');
    }

    if (!res.ok) {
      var message = '';
      try {
        message = (await res.json()).error || '';
      } catch (err) { /* not a JSON error */ }
      if (!message && res.status === 404) {
        // Ori's own server always answers this address, so something else is serving the page.
        message = 'This page was opened by a different program, not Ori’s server. Close that program, run "npm start" in the Ori folder, then reload this page.';
      }
      throw new Error(message || 'Something went wrong (' + res.status + '). Please try again.');
    }

    var reader = res.body.getReader();
    var decoder = new TextDecoder();
    for (;;) {
      var part = await reader.read();
      if (part.done) break;
      onText(decoder.decode(part.value, { stream: true }));
    }
  }

  async function send(text) {
    text = text.trim();
    if (!text || busy) return;

    var chat = findChat(currentId);
    if (!chat) {
      chat = { id: makeId(), title: makeTitle(text), updated: Date.now(), messages: [] };
      chats.unshift(chat);
      currentId = chat.id;
    }
    chat.messages.push({ role: 'user', content: text });
    chat.updated = Date.now();
    save();
    renderDrawer();

    empty.hidden = true;
    addMessageEl('user', text);
    input.value = '';
    resizeInput();

    var el = addMessageEl('assistant', '');
    el.classList.add('thinking');
    scrollToBottom(true);

    var run = ++runId;
    var reply = '';
    var problem = '';
    var painting = false;
    var history = chat.messages.slice();
    controller = new AbortController();
    busy = true;
    updateSendState();

    function paint() {
      painting = false;
      if (run !== runId) return;
      var stick = nearBottom();
      el.classList.remove('thinking');
      el.innerHTML = renderMarkdown(reply);
      if (stick) scrollToBottom(false);
    }

    try {
      await requestReply(history, controller.signal, function (piece) {
        reply += piece;
        if (!painting && reply) {
          painting = true;
          requestAnimationFrame(paint);
        }
      });
      if (!reply.trim()) problem = 'Ori didn’t send a reply. Please try again.';
    } catch (err) {
      if (!err || err.name !== 'AbortError') {
        problem = (err && err.message) || 'Something went wrong. Please try again.';
      }
    }

    // Keep whatever arrived, even if the reply was stopped or the chat was switched.
    if (reply.trim()) {
      chat.messages.push({ role: 'assistant', content: reply });
      chat.updated = Date.now();
      save();
    }

    if (run !== runId) return; // the view has moved on to another chat

    controller = null;
    busy = false;
    var stick = nearBottom();
    if (reply.trim()) {
      el.classList.remove('thinking');
      el.innerHTML = renderMarkdown(reply);
    } else if (el.parentNode) {
      el.parentNode.removeChild(el);
    }
    if (problem) addMessageEl('error', problem);
    updateSendState();
    if (stick || problem) scrollToBottom(true);
  }

  /* ---------- Events ---------- */

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    send(input.value);
  });

  sendBtn.addEventListener('click', function (e) {
    if (busy) {
      e.preventDefault();
      if (controller) controller.abort(); // stop; send() tidies up
    }
  });

  input.addEventListener('input', function () {
    resizeInput();
    updateSendState();
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send(input.value);
    }
  });

  empty.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (chip) send(chip.textContent);
  });

  menuBtn.addEventListener('click', function () {
    if (screen.classList.contains('drawer-open')) closeDrawer();
    else openDrawer();
  });

  scrim.addEventListener('click', closeDrawer);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDrawer();
  });

  newChatBtn.addEventListener('click', function () {
    showChat(null);
  });

  drawerNewBtn.addEventListener('click', function () {
    showChat(null);
  });

  chatList.addEventListener('click', function (e) {
    var del = e.target.closest('.chat-del');
    if (del) {
      deleteChat(del.dataset.id);
      return;
    }
    var open = e.target.closest('.chat-open');
    if (open) showChat(open.dataset.id);
  });

  /* ---------- Frame: clock and fit-to-window scaling ---------- */

  function tick() {
    var d = new Date();
    var m = d.getMinutes();
    clock.textContent = (d.getHours() % 12 || 12) + ':' + (m < 10 ? '0' : '') + m;
  }

  function fit() {
    var scale = Math.min(1, (window.innerHeight - 40) / 866, (window.innerWidth - 24) / 412);
    phone.style.setProperty('--scale', Math.max(0.3, scale).toFixed(4));
  }

  tick();
  setInterval(tick, 5000);
  fit();
  window.addEventListener('resize', fit);

  load();
  renderThread();
  renderDrawer();
  updateSendState();
  if (finePointer) input.focus();
})();
</script>
</body>
</html>
